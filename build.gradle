plugins {
    id 'org.springframework.boot' version '3.5.16'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'java'
    id 'eclipse'
}

group = 'com.mindex'
version = '0.0.1-SNAPSHOT'
sourceCompatibility = 19

repositories {
    mavenCentral()
}

configurations {
    configureEach {
        exclude group: 'org.springframework.boot', module: 'spring-boot-starter-logging'
    }
}

dependencies {
    // Spring Boot Starters (Handles Web, JDBC, and internal dependencies)
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'

    // Upgraded Database Drivers for JDK 19+ Environments
    implementation 'com.oracle.database.jdbc:ojdbc11-production:23.5.0.24.07'
    implementation 'de.bwaldvogel:mongo-java-server:1.44.0'

    // Utilities & Logging
    implementation 'org.slf4j:slf4j-simple:2.0.12'
    implementation 'org.apache.commons:commons-lang3:3.18.0'
    implementation 'com.opencsv:opencsv:5.12.0'

    // Lombok Annotation Processing Setup
    implementation 'org.projectlombok:lombok:1.18.30'
    annotationProcessor 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'

    // Testing Framework (REMOVED explicit junit-jupiter versions)
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

test {
    useJUnitPlatform()
}